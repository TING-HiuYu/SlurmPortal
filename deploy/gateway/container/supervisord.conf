[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/web-access-gateway/supervisord.pid
childlogdir=/run/web-access-gateway

[eventlistener:exit-on-fatal]
command=/usr/bin/python3 -u /usr/local/bin/gateway-exit-on-fatal
priority=1
events=PROCESS_STATE_FATAL
stdout_logfile=NONE
buffer_size=10
startsecs=0
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/local/libexec/go-ldap-admin/web-access-gateway -config /etc/go-ldap-admin/web-access-gateway.yaml
priority=10
startsecs=2
startretries=5
autorestart=true
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/go-ldap-admin/web-access-gateway/nginx.conf -g "daemon off;"
priority=20
startsecs=2
startretries=5
autorestart=true
stopsignal=QUIT
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
