# Slurm Portal master in containers. Run ./init.sh once, ./add-cluster.sh per cluster, then
#   docker compose up -d
# Services: Caddy (HTTPS for browsers, automatic certificates), the master (SQLite in ./data), and an
# S3 store (RustFS) for live cluster status. Slaves connect straight to the master on SYNC_PORT with
# mutual TLS. See docs/deploy-container-master.md.
name: slurm-portal-master

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      PORTAL_HOST: ${PORTAL_HOST}
      STATUS_BUCKET: ${STATUS_BUCKET}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on: [master, s3]

  master:
    build:
      context: ../../..
      dockerfile: deploy/docker/master.Dockerfile
    image: slurm-portal-master:local
    restart: unless-stopped
    env_file: .env
    environment:
      # Browsers reach the master only through Caddy, which terminates HTTPS.
      BEHIND_TLS_PROXY: "true"
      TRUSTED_IP_HEADER: X-Forwarded-For
      SYNC_LISTEN: 0.0.0.0:8443
      SYNC_CERT_FILE: /certs/master.crt
      SYNC_KEY_FILE: /certs/master.key
      SYNC_CLIENT_CA_FILE: /certs/ca.crt
      PLUGIN_CURRENT_STATUS_R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      PLUGIN_CURRENT_STATUS_R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      # Browsers fetch status objects from the portal's own origin; Caddy forwards /<bucket>/ to S3.
      PLUGINS_CONFIG: >-
        {"current-status": {"bucket": "${STATUS_BUCKET}", "endpoint": "http://s3:9000",
         "public-endpoint": "https://${PORTAL_HOST}"}}
    expose: ["8080"]
    ports:
      - "${SYNC_PORT:-8443}:8443"   # slaves and gateways, mutual TLS
    volumes:
      - ./data/master:/data
      - ./secrets/certs/master.crt:/certs/master.crt:ro
      - ./secrets/certs/master.key:/certs/master.key:ro
      - ./secrets/certs/ca.crt:/certs/ca.crt:ro
    user: "${PORTAL_UID:-10001}:${PORTAL_GID:-10001}"
    depends_on:
      s3-setup:
        condition: service_completed_successfully

  s3:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_REGION: auto
      RUSTFS_VOLUMES: /data
    expose: ["9000"]
    volumes:
      - ./data/s3:/data
      - ./data/s3-logs:/logs
    user: "${PORTAL_UID:-10001}:${PORTAL_GID:-10001}"

  # One-shot: create the status bucket.
  s3-setup:
    image: amazon/aws-cli:2.39.2
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: auto
      STATUS_BUCKET: ${STATUS_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        s3() { aws --endpoint-url http://s3:9000 "$$@"; }
        for i in $$(seq 1 60); do s3 s3api list-buckets >/dev/null 2>&1 && break; sleep 2; done
        s3 s3api head-bucket --bucket "$$STATUS_BUCKET" >/dev/null 2>&1 || s3 s3api create-bucket --bucket "$$STATUS_BUCKET"
        echo "status bucket ready"
